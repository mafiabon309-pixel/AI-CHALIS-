<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میرا ذاتی چالس (Chat AI)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: #1e1e1e;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .chat-header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 15px;
            border-names: 8px;
            max-width: 80%;
            word-wrap: break-word;
            border-radius: 10px;
            font-size: 15px;
        }

        .user-message {
            background: #3498db;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        .bot-message {
            background: #333333;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 0;
            border: 1px solid #444;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #252525;
            border-top: 1px solid #333;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #444;
            background: #1e1e1e;
            color: white;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }

        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 0 20px;
            margin-right: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">میرا چیٹ بوٹ (Chat AI)</div>
    
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">سلام! میں آپ کا نیا چیٹ بوٹ ہوں۔ بتائیں میں آپ کی کیا مدد کر سکتا ہوں؟</div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="یہاں کچھ لکھیں..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">بھیجیں</button>
    </div>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if (text === "") return;

        appendMessage(text, "user-message");
        input.value = "";

        // خودکار جواب دینے کا طریقہ (آپ اسے اپنی مرضی سے بدل سکتے ہیں)
        setTimeout(() => {
            let botReply = getBotResponse(text);
            appendMessage(botReply, "bot-message");
        }, 600);
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }

    function getBotResponse(input) {
        input = input.toLowerCase();
        if (input.includes("سلام") || input.includes("ہیلو")) {
            return "وعلیکم السلام! کیسے ہیں آپ؟";
        } else if (input.includes("کیا حال ہے")) {
            return "میں بالکل ٹھیک ہوں، آپ سنائیں!";
        } else if (input.includes("تم کون ہو")) {
            return "میں آپ کا بنایا ہوا لوکل چیٹ بوٹ ہوں۔";
        } else {
            return "آپ نے بہت اچھی بات کی ہے، لیکن میں فی الحال ایک سادہ آف لائن بوٹ ہوں جو محدود باتیں سمجھ سکتا ہے۔";
        }
    }
</script>

</body>
</html>
